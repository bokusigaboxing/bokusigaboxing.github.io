<title>映画館｜shutanakajima ポートフォリオサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Shippori+Mincho+B1:wght@400;600&display=swap">
<style>
/* Layout: 画面いっぱいに横長（16:9）の映画館。文字は下の端の小さな時計と、左の螺旋を押して開く雑誌だけ。比が違う画面では、はみ出す側を切る（cover） */
:root{--ground:#050304;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ground);overflow:hidden}
.frame{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%)}
.frame{touch-action:none}
.frame canvas,.frame img{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame img{object-fit:cover;transition:opacity 1.2s ease}
.frame canvas.live{pointer-events:none}
/* 時計：下の端に小さく。帯は一巡り（昼 60 秒、夜 60 秒）、縦の線がいま */
.clock{position:fixed;left:50%;bottom:max(14px,2.4vh);transform:translateX(-50%);width:min(300px,calc(100vw - 32px));margin:0;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:rgba(232,222,214,.6);text-shadow:0 0 6px rgba(0,0,0,.9);pointer-events:none}
.cyc{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(232,222,214,.3)}
.cyc span{padding-top:4px}
.cyc span+span{border-left:1px solid rgba(232,222,214,.3);padding-left:6px}
.cyc i{position:absolute;top:-4px;width:1px;height:7px;background:rgba(244,236,230,.9)}
.clock p{margin:3px 0 0;white-space:pre-line}
/* 読むための螺旋階段（寄った後）。「螺旋の雑誌」と同じ漆の地 */
.rd{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:5;opacity:0;pointer-events:none;background:#6e8cb4 url(mag/sea.jpg) center/cover no-repeat;touch-action:none}
.rd.on{pointer-events:auto}
.rd-back{position:fixed;left:16px;top:14px;z-index:6;font:11px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#e8e0cf;background:rgba(19,17,14,.72);border:1px solid rgba(207,197,180,.28);padding:6px 10px;cursor:pointer}
.rd-back:hover{color:#eadfca;border-color:#7a6743}
.rd-back[hidden]{display:none}
.clock{z-index:7}
/* トップへ戻る（左下に小さく、本人の指定 2026-10-15） */
.home{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,2.4vh);z-index:7;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:rgba(232,222,214,.6);text-shadow:0 0 6px rgba(0,0,0,.9);text-decoration:none}
.home:hover,.home:focus-visible{color:#e8e0cf;outline:none;text-decoration:underline;text-underline-offset:3px}
body.rdmode .home,body.reading .home{visibility:hidden}
@media (max-width:520px){.home{bottom:auto;top:max(14px,env(safe-area-inset-top,0px))}}  /* 狭い画面では下の時計と重ならないよう左上へ */
body.rdmode .clock{background:rgba(19,17,14,.9);padding:6px 12px 8px;width:auto;max-width:calc(100vw - 32px);text-align:center}
body.rdmode .cyc{display:none}
/* 雑誌：左の螺旋の紙を押すと開く。「螺旋の雑誌」と同じ紙と、同じ漆と金の色 */
.mag{--bg:#13110e;--fg:#e8e0cf;--muted:#9b917f;--line:#3b342b;--gold:#c9a45c;--gold-dim:#7a6743;--paper:#ebe4d4;position:fixed;inset:0;z-index:10;display:block;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 56px;box-sizing:border-box;background:rgba(19,17,14,.97);color:#cfc5b4;font:11px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;opacity:0;transition:opacity .45s ease}
.mag[hidden]{display:none}
.mag.on{opacity:1}
.mag button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:6px 8px;cursor:pointer}
.mag button:hover:not(:disabled){color:#eadfca}
.mag button:disabled{opacity:.3;cursor:default}
.mag button:focus{outline:none}
.mag button:focus-visible{outline:1px solid #b39a62;outline-offset:2px}
body.reading .clock{visibility:hidden}
.mag-bar,.mag-foot{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:min(760px,100%);margin:0 auto}
.mag-bar{position:sticky;top:0;z-index:2;padding:14px 0 10px;background:rgba(19,17,14,.97)}
.mag-foot{padding-top:10px}
.mag-ad{color:#b39a62;white-space:nowrap}
.mag-ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:14px;letter-spacing:.08em;color:#eadfca}
.mag-body{display:flex;align-items:center;justify-content:center;gap:6px}
.mag-paper{--ph:min(calc(100vh - 150px),calc((100vw - 120px) * 1.414));height:var(--ph);width:calc(var(--ph) / 1.414);background:#ebe4d4;box-shadow:0 18px 40px rgba(0,0,0,.55);transform:translateY(8px);transition:transform .55s ease}
.mag.on .mag-paper{transform:none}
.mag-paper iframe{display:block;width:100%;height:100%;border:0;background:#ebe4d4}
.mag-nav{font-size:22px!important;padding:12px 10px!important;color:#b39a62!important}
.mag-foot a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(207,197,180,.3)}
.mag-foot a:hover{color:#eadfca}
/* 下へ送ると、「螺旋の雑誌」と同じ番地・方位（平面図）・立面図 */
.mag-down{width:min(760px,100%);margin:18px auto 0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:.14em}
.mag-side{width:min(760px,100%);margin:28px auto 0;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:22px}
.mag-addr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;letter-spacing:.06em;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:8px}
.mag-addr #mAng{font-size:12px;color:var(--gold)}
.mag-navs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mag-navs button{background:#1b1814!important;border:1px solid var(--line)!important;padding:8px 10px!important;font-size:12px;text-align:center}
.mag-navs button:hover:not(:disabled){border-color:var(--gold-dim)!important}
.mag-figs{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mag-figs figure{margin:0}
.mag-figs svg{display:block;width:100%;height:auto}
.mag-figs figcaption{font-size:11px;line-height:1.7;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.mag-figs figcaption b{color:var(--fg);font-weight:500}
@media (max-width:640px){.mag-figs{grid-template-columns:1fr}.mag-navs{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){.mag,.mag-paper{transition:none}}
@media (prefers-reduced-motion: reduce){.frame img{transition:none}}
</style>
