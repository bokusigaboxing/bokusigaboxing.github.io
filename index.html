<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>shutanakajima ポートフォリオサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* ムーンショット（本人が三案から選んだ B、2026-10-15）。瞬きの合間に、今日の月が瞳の位置へ寄る（案 3、本人が選んだ。2026-10-15）。白い地、グロテスク体の小さな字、生きた日付（kamikene.org の調子）。
   朱の矢が弧を描いて今日の月へ飛び、戻る。名前の意味や説明の文は置かない（本人の指定） */
:root{
  --bg:#ffffff; --ink:#111111; --soft:rgba(17,17,17,.56); --shu:#d23a20;
  --sans:"Instrument Sans","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f0e;--ink:#ecebe6;--soft:rgba(236,235,230,.56);--shu:#ef5a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0e;--ink:#ecebe6;--soft:rgba(236,235,230,.56);--shu:#ef5a3c;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover,a:focus-visible{color:var(--shu);outline:none}
a:focus-visible{text-decoration:underline;text-underline-offset:3px}

.page{min-height:100%;box-sizing:border-box;padding-block:24px 26px;padding-left:max(26px, env(safe-area-inset-left, 0px));padding-right:max(26px, env(safe-area-inset-right, 0px));display:grid;grid-template-rows:auto 1fr}
.bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.62fr);gap:16px;align-items:start}
.who .jp{font-family:var(--jp);font-weight:700;letter-spacing:.04em}
.who b{font-weight:600}
.clock{font-size:20.7px;line-height:1.5;font-variant-numeric:tabular-nums}
.moon-line{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--soft);font-variant-numeric:tabular-nums}
.moon-line svg{width:15px;height:15px;flex:none}
/* 入口は矢の雨（本人が選んだ、2026-10-15。主題は矢印）。上の端から細い矢が三本ずつ降る。
   Biography と Works は下を向く矢で、カーソルを合わせると三本が少しずつずれて重さで落ちる。
   Cinema だけは三枚の羽で、根元から開いた翼の形。合わせると、昇りながら翼が開く（重力と恩寵） */
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:44px;justify-content:flex-start;align-items:flex-start}
nav li a{display:flex;flex-direction:column;align-items:center;text-align:center}
nav .rain{display:block;width:26px;flex:none;margin-top:calc(-24px - env(safe-area-inset-top, 0px))}
nav .rain svg{display:block;width:26px;height:100%;overflow:visible}
nav .rain line,nav .rain path{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
nav .rain .barb{stroke:var(--soft)}
nav .rain .vane{fill:var(--bg);stroke:var(--ink)}
nav .rain g{transform-box:view-box;transition:transform .55s cubic-bezier(.55,.05,.9,.45)}
nav .rain g:nth-child(2){transition-delay:.06s}
nav .rain g:nth-child(3){transition-delay:.12s}
nav li a:hover .rain g,nav li a:focus-visible .rain g{transform:translateY(14px)}
nav li.grace .rain g{transition:transform 1.1s cubic-bezier(.2,.7,.25,1)}
nav .wingbox{width:70px}
nav .wingbox svg{width:70px}
nav .wingbox .vane,nav .wingbox .barb{stroke-width:.75}  /* 翼は参考の絵（本人が渡した、横から見た翼）にならう：丸い肩、鱗の雨覆、平行に重なる風切羽 */
nav .rain .thread{stroke:var(--soft);transition:transform 1.1s cubic-bezier(.2,.7,.25,1);transform-box:view-box;transform-origin:0 0}
nav li.grace a:hover .rain .wg,nav li.grace a:focus-visible .rain .wg{transform:translateY(-16px) rotate(-10deg)}  /* 翼は昇りながら、肩を軸に少し羽ばたく */
nav li.grace a:hover .rain .thread,nav li.grace a:focus-visible .rain .thread{transform:scaleY(.72)}
nav li a:hover .rain line,nav li a:hover .rain path,nav li a:focus-visible .rain line,nav li a:focus-visible .rain path{stroke:var(--shu)}
nav .en{font-size:20.7px;line-height:1.3;margin-top:6px}
nav .jp{font-family:var(--jp);font-size:13px;line-height:1.4;color:var(--soft)}
nav li a:hover .jp,nav li a:focus-visible .jp{color:var(--shu)}
nav li a:focus-visible{text-decoration:none}
nav li a:focus-visible .en{text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){ nav .rain g{transition:none} }

.stage{min-height:0;display:grid;place-items:center}
.shot{position:relative;width:min(84vw,140vh);aspect-ratio:16/7;max-width:100%}
.shot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.moon-lit{fill:var(--ink)}
.moon-rim{fill:none;stroke:var(--ink);stroke-width:1.2}
.go{fill:none;stroke:var(--shu);stroke-width:1.6}
.back{fill:none;stroke:var(--shu);stroke-width:1.2;stroke-dasharray:3 6}
.tip{fill:var(--shu)}

@media (max-width: 720px){
  .bar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .bar nav{grid-column:1 / -1}
  nav ul{gap:32px}
  nav .rain{margin-top:0;height:44px !important}  /* スマホでは入口が二段目なので、矢の先だけを見せる（上は切る） */
  nav .rain svg{overflow:hidden}
  .clock{font-size:16px}
  .shot{width:100%;aspect-ratio:4/5}
}
</style>
</head>
<body>

<div class="page">
  <header class="bar">
    <div class="who"><span class="jp">中嶋脩太</span><br><b>Shuta Nakajima</b></div>
    <div>
      <div class="clock"><span id="date">Thursday Oct 15 2026</span><br><span id="time">12:00:00</span></div>
      <div class="moon-line"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1"/><path id="moonIcon" fill="currentColor" d=""/></svg><span id="moonTxt">月齢 —</span></div>
    </div>
    <nav aria-label="入口">
      <ul>
        <li><a href="biography.html"><span class="rain" aria-hidden="true" style="height:70px"><svg viewBox="0 0 26 70" preserveAspectRatio="xMidYMax slice"><g><line x1="5" y1="0" x2="5" y2="43.4"/><path d="M2 37.4L5 43.4L8 37.4"/></g><g><line x1="13" y1="0" x2="13" y2="64.4"/><path d="M10 58.4L13 64.4L16 58.4"/></g><g><line x1="21" y1="0" x2="21" y2="51.8"/><path d="M18 45.8L21 51.8L24 45.8"/></g></svg></span><span class="en">Biography</span><span class="jp">経歴</span></a></li>
        <li><a href="works.html"><span class="rain" aria-hidden="true" style="height:94px"><svg viewBox="0 0 26 94" preserveAspectRatio="xMidYMax slice"><g><line x1="5" y1="0" x2="5" y2="58.3"/><path d="M2 52.3L5 58.3L8 52.3"/></g><g><line x1="13" y1="0" x2="13" y2="86.5"/><path d="M10 80.5L13 86.5L16 80.5"/></g><g><line x1="21" y1="0" x2="21" y2="69.6"/><path d="M18 63.6L21 69.6L24 63.6"/></g></svg></span><span class="en">Works</span><span class="jp">作品</span></a></li>
        <li class="grace"><a href="cinema.html"><span class="rain wingbox" aria-hidden="true" style="height:84px"><svg viewBox="-2 0 70 84" preserveAspectRatio="xMidYMax slice"><line class="thread" x1="20" y1="0" x2="20" y2="55.6"/><g class="wg" style="transform-origin:20px 55.6px"><path class="vane" d="M2.23 72.77 L9.29 79.47 Q13.57 80.57 12.47 76.29 L5.77 69.23Z"/><path class="vane" d="M4.29 71.54 L14.14 79.79 Q18.58 80.49 17.29 76.19 L7.79 67.54Z"/><path class="vane" d="M6.44 70.38 L18.97 79.75 Q23.52 80.09 22.06 75.77 L9.87 65.96Z"/><path class="vane" d="M8.66 69.3 L23.75 79.39 Q28.38 79.39 26.76 75.05 L12 64.47Z"/><path class="vane" d="M10.96 68.28 L28.45 78.72 Q33.13 78.38 31.33 74.06 L14.15 63.1Z"/><path class="vane" d="M13.33 67.33 L33.06 77.75 Q37.75 77.09 35.76 72.8 L16.32 61.84Z"/><path class="vane" d="M15.76 66.45 L37.56 76.48 Q42.22 75.53 40.02 71.31 L18.49 60.7Z"/><path class="vane" d="M18.24 65.62 L41.92 74.94 Q46.53 73.71 44.1 69.6 L20.65 59.7Z"/><path class="vane" d="M20.76 64.86 L46.13 73.12 Q50.65 71.63 47.97 67.69 L22.8 58.83Z"/><path class="vane" d="M23.3 64.16 L50.15 71.05 Q54.55 69.31 51.62 65.6 L24.92 58.1Z"/><path class="vane" d="M25.84 63.51 L53.97 68.73 Q58.23 66.76 55.03 63.33 L27.02 57.52Z"/><path class="vane" d="M28.38 62.93 L57.56 66.18 Q61.65 64 58.2 60.91 L29.09 57.08Z"/><path class="vane" d="M30.88 62.42 L60.9 63.41 Q64.8 61.03 61.11 58.34 L31.12 56.78Z"/><path class="vane" d="M5 75 C0 69 1 57 10 56 C18 55 28 55 36 57 Q36.2 60.2 33 60 Q31.39 63.23 28 62 Q26.39 65.23 23 64 Q21.57 67.4 18 66.5 Q16.57 69.9 13 69 Q12.44 72.42 9 72 Q8.44 75.42 5 75Z"/><path class="barb" d="M31 57.6 Q29.66 60.19 27 59M27 59 Q25.42 61.68 22.5 60.6M22.5 60.6 Q21.03 63.39 18 62.5M18 62.5 Q16.56 65.33 13.5 64.5M13.5 64.5 Q12.5 67.38 9.5 66.8M9.5 66.8 Q8.97 69.73 6 69.5"/></g></svg></span><span class="en">Cinema</span><span class="jp">映画館</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="stage">
    <div class="shot" aria-hidden="true">
      <svg id="art" viewBox="0 0 1600 700"></svg>
    </div>
  </main>
</div>

<script>
(function(){
  var D = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  /* 瞳の中の月：瞬きの合間の一分で、月が瞳の位置へ寄る。瞬くと瞼に隠れ、開くと元の場所に戻っている */
  /* 月齢：2000-01-06 18:14 UTC の新月から、朔望月 29.530588853 日で数える（おおよそ） */
  var SYN = 29.530588853, NEW = Date.UTC(2000, 0, 6, 18, 14), ph = 0;
  function moonPath(cx, cy, r, f){
    var rx = Math.abs(Math.cos(f * 2 * Math.PI)) * r, top = cx + ' ' + (cy - r), bot = cx + ' ' + (cy + r);
    if (f < .5) return 'M' + top + 'A' + r + ' ' + r + ' 0 0 1 ' + bot + 'A' + rx + ' ' + r + ' 0 0 ' + (f < .25 ? 0 : 1) + ' ' + top + 'Z';
    return 'M' + top + 'A' + r + ' ' + r + ' 0 0 0 ' + bot + 'A' + rx + ' ' + r + ' 0 0 ' + (f < .75 ? 0 : 1) + ' ' + top + 'Z';
  }
  var $ = function (id) { return document.getElementById(id); };
  var lerp = function (P, Q, t) { return [P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]; };
  var bez = function (Q, t) { var u = 1 - t; return [0, 1].map(function (k) { return u * u * u * Q[0][k] + 3 * u * u * t * Q[1][k] + 3 * u * t * t * Q[2][k] + t * t * t * Q[3][k]; }); };
  var cub = function (Q) { return 'M' + Q[0][0].toFixed(1) + ' ' + Q[0][1].toFixed(1) + 'C' + Q.slice(1).map(function (q) { return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(', '); };

  /* 横長と縦長（スマホ）で、矢の弧と月の位置を描き分ける。弧は三次ベジェの四点 */
  var art = $('art'), LAY = {
    wide: {vb: '0 0 1600 700', m: [1400, 230, 120], go: [[90, 640], [420, 120], [980, 40], [1330, 250]], back: [[1330, 250], [1080, 520], [520, 700], [120, 650]]},
    tall: {vb: '0 0 800 1000', m: [600, 210, 120], go: [[40, 960], [60, 560], [260, 260], [530, 245]], back: [[530, 245], [520, 560], [300, 860], [70, 975]]}
  }, cur = '', L = null, G = null, B = null, IRIS = null;
  var lidT = 0, drift = 0, clipOn = false, back = false;  /* back：瞬きで元の場所へ戻った月。目が開くのと一緒に現れる */
  function layout(){
    var k = matchMedia('(max-width: 720px)').matches ? 'tall' : 'wide'; if (k === cur) return; cur = k; L = LAY[k];
    G = L.go; B = L.back;
    var up = bez(G, .5), lo = bez(B, .5); IRIS = [(up[0] + lo[0]) / 2, (up[1] + lo[1]) / 2];  /* 瞳の位置：二本の弧の真ん中 */
    art.setAttribute('viewBox', L.vb);
    art.innerHTML = '<path class="go" id="lidU"/><path class="back" id="lidL"/><path class="tip" id="tip"/>' +
      '<g id="moon"><circle class="moon-rim" id="moonRim" r="' + L.m[2] + '"/><path class="moon-lit" id="moonBig"/></g>';
    draw();
  }

  /* 瞬き：二本の弧を瞼に見立てる。閉じた線は下の弧寄り（上の瞼がよく動く）。lidT＝0 開き、1 閉じ */
  function draw(){
    var R = B.slice().reverse(), shut = G.map(function (g, i) { return lerp(g, R[i], .72); });
    var U = G.map(function (g, i) { return lerp(g, shut[i], lidT); }), Lo = R.map(function (r, i) { return lerp(r, shut[i], lidT); });
    $('lidU').setAttribute('d', cub(U)); $('lidL').setAttribute('d', cub(Lo.reverse()));
    var e = U[3], c = U[2], dx = e[0] - c[0], dy = e[1] - c[1], n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    $('tip').setAttribute('d', 'M' + e[0].toFixed(1) + ' ' + e[1].toFixed(1) + 'L' + (e[0] - dx * 26 - dy * 10).toFixed(1) + ' ' + (e[1] - dy * 26 + dx * 10).toFixed(1) + 'L' + (e[0] - dx * 26 + dy * 10).toFixed(1) + ' ' + (e[1] - dy * 26 - dx * 10).toFixed(1) + 'Z');
    var q = drift * drift * (3 - 2 * drift), at = lerp([L.m[0], L.m[1]], IRIS, q);
    $('moonRim').setAttribute('cx', at[0]); $('moonRim').setAttribute('cy', at[1]);
    $('moonBig').setAttribute('d', moonPath(at[0], at[1], L.m[2], ph));
    {  /* 瞬きのあいだ、瞳にいる月は瞼に隠れる（二本の弧で囲んだ形で切る） */
      if (!$('lidclip')) art.insertAdjacentHTML('afterbegin', '<clipPath id="lidclip"><path id="lidclipP"/></clipPath>');
      $('lidclipP').setAttribute('d', cub(U) + 'L' + Lo[0][0].toFixed(1) + ' ' + Lo[0][1].toFixed(1) + cub(Lo).replace(/^M[^C]*/, '') + 'Z');
      if (clipOn) $('moon').setAttribute('clip-path', 'url(#lidclip)'); else $('moon').removeAttribute('clip-path');
      $('moon').style.opacity = back ? (1 - lidT).toFixed(3) : '';
    }
  }
  function closedMoment(){ drift = 0; clipOn = false; back = true; }  /* 閉じ切った瞬間に戻し、開くまでは見せない */

  /* 瞬きは一分に一度ほど（本人の指定、2026-10-15）。最初の一度は、読み込み終わって（画面が見えて）3 秒後（本人の指定）。それまでは瞬かず、月も動かない */
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, last = performance.now(), next = Infinity, t0 = 0, fired = false, first = true;
  function arm(){ if (!first || document.hidden) return; last = performance.now(); next = last + 3000; first = false; }
  if (document.readyState === 'complete') arm(); else window.addEventListener('load', arm);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && next === Infinity) { first = true; arm(); } });
  function frame(now){
    if (!t0 && now >= next) { t0 = now; fired = false; clipOn = drift > .5; }
    if (t0) {
      /* 閉じる 0.14 秒、閉じ切って 1 秒（本人の指定、2026-10-15）、開く 0.18 秒 */
      var CL = 140, HOLD = 1000, OP = 180, ms = now - t0, u = ms / (CL + HOLD + OP);
      var t = ms < CL ? ms / CL : ms < CL + HOLD ? 1 : 1 - (ms - CL - HOLD) / OP;
      t = Math.max(0, Math.min(1, t)); lidT = t * t * (3 - 2 * t);
      if (!fired && ms >= CL) { fired = true; closedMoment(); }
      if (u >= 1) { t0 = 0; lidT = 0; clipOn = false; back = false; last = now; next = now + 52000 + Math.random() * 16000; }  /* 52〜68 秒あける */
    } else drift = Math.max(0, Math.min(1, (now - (next - 3000)) / 3000));  /* 瞬きの 3 秒前から寄る（本人の指定、2026-10-15） */
    draw(); requestAnimationFrame(frame);
  }
  /* 静止画を撮るための口：__frame(瞼, 寄り, 瞬きの回数) */
  window.__frame = function (t, d, blinks, clip, bk) { lidT = t; drift = d; clipOn = !!clip; back = !!bk; for (var i = 0; i < (blinks || 0); i++) closedMoment(); draw(); };

  function tick(){
    var n = new Date();
    $('date').textContent = D[n.getDay()] + ' ' + M[n.getMonth()] + ' ' + n.getDate() + ' ' + n.getFullYear();
    $('time').textContent = p2(n.getHours()) + ':' + p2(n.getMinutes()) + ':' + p2(n.getSeconds());
    var age = (((n.getTime() - NEW) / 864e5) % SYN + SYN) % SYN; ph = age / SYN;
    $('moonTxt').textContent = '月齢 ' + age.toFixed(1);
    $('moonIcon').setAttribute('d', moonPath(8, 8, 7, ph));
    draw();
  }
  layout(); tick(); setInterval(tick, 1000);
  if (!still) requestAnimationFrame(frame);
  window.addEventListener('resize', function(){ layout(); });
})();
</script>

</body>
</html>
