<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロビー｜shutanakajima ポートフォリオサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap">
<style>
/* 映画館の手前のロビー（2026-10-18、本人の指定）。廃墟のロビーを映画館と同じ作り方で焼いた一枚（lobby/wide.jpg）に、
   ポスター八枚と劇場の扉を押せる所として重ねる。ポスターを押すと、螺旋のように画がそのポスターへ寄り、
   その前に立って見た画（lobby/p1–p8.jpg、ポスターごとに焼いたもの。押したときに一枚ずつ読む）に入れ替わる。
   寄りの画でポスターを押すと、さらに寄って、ポスターの面だけを正面から描いた画（lobby/z1–z8.jpg）で字が読める（2026-10-18、本人の指定）。扉を押すと映画館へ。光は時間で変えない。
   画は inei/lobby/ で焼き、finish.js が仕上げて、下の位置の表（LOBBY）も書く */
:root{color-scheme:dark;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html,body{margin:0;height:100%;background:#050303;color:#e8e0cf;overflow:hidden}
.sc{position:fixed;inset:0;overflow:hidden;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.sc.pan{overflow-x:auto;overflow-y:hidden}
.stage{position:absolute;transform-origin:0 0;opacity:0;transition:opacity .8s}
.stage.on{opacity:1}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hot{fill:transparent;stroke:none;cursor:zoom-in;outline:none}
.hot:focus-visible{stroke:rgba(232,224,207,.7);stroke-width:2;vector-effect:non-scaling-stroke}
.door .hot{cursor:pointer}
.near{position:fixed;inset:0;opacity:0;pointer-events:none;cursor:zoom-out}
.near img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s;transform-origin:0 0}
/* さらに寄った画：ポスターの面だけを正面から。寄りの画をそのポスターへ拡げ、その上に重ねる */
.zoom{position:fixed;left:0;top:0;opacity:0;pointer-events:none;transition:opacity .45s;transform-origin:50% 50%;cursor:zoom-out;z-index:4}
.near.on{pointer-events:auto}
.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
/* 画面に貼り付く小さな字（映画館の時計と同じ） */
.ui{position:fixed;bottom:max(14px,2.4vh);z-index:5;font:11px/1.5 var(--mono);letter-spacing:.08em;color:rgba(232,222,214,.6);text-shadow:0 0 6px rgba(0,0,0,.9)}
.ui a,.ui button{color:inherit;text-decoration:none;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;cursor:pointer}
.ui a:hover,.ui a:focus-visible,.ui button:hover,.ui button:focus-visible{color:#e8e0cf;outline:none;text-decoration:underline;text-underline-offset:3px}
.home{left:max(16px,env(safe-area-inset-left,0px))}
.cap{left:50%;transform:translateX(-50%);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.cap.on{opacity:1}
.nav{right:max(16px,env(safe-area-inset-right,0px));display:none;gap:14px}
body.near-mode .nav{display:flex}
@media (max-width:520px){.home{bottom:auto;top:max(14px,env(safe-area-inset-top,0px))}.cap{bottom:max(38px,6vh)}}
</style>
</head>
<body>
<div class="sc" id="sc"><div class="stage" id="stage"><img id="wide" src="lobby/wide.jpg" alt="廃墟になった映画館のロビー。左に切符売場、右の壁に詩と短歌のポスターが八枚、奥に劇場の扉"><svg id="hots" viewBox="0 0 1440 810" preserveAspectRatio="none"></svg></div></div>
<div class="near" id="near" aria-hidden="true"><img id="n0" alt=""><img id="n1" alt="" style="opacity:0"></div>
<img class="zoom" id="zimg" alt="">
<div class="fade" id="fade"></div>
<a class="ui home" id="home" href="index.html">← Top</a>
<div class="ui cap" id="cap" aria-live="polite"></div>
<div class="ui nav" id="nav"><button type="button" id="prev">← 前</button><span id="num"></span><button type="button" id="next">次 →</button></div>
<script>
/*LOBBY*/var LOBBY = {"w":1440,"h":810,"posters":[{"cap":"詩｜「ソネットと場違い」","aspect":0.7061,"tilt":0,"wide":[[0.8658,0.2757],[0.9651,0.2457],[0.9592,0.5285],[0.8619,0.5159]],"near":[[0.35,0.132],[0.65,0.132],[0.65,0.8633],[0.35,0.8633]],"face":[[0.3686,0.1684],[0.6314,0.1684],[0.6314,0.8303],[0.3686,0.8303]]},{"cap":"短歌コラージュ","aspect":0.75,"tilt":0.012,"wide":[[0.734,0.3163],[0.7933,0.2966],[0.7916,0.5059],[0.7329,0.5002]],"near":[[0.3393,0.1354],[0.6558,0.1287],[0.6607,0.8599],[0.3442,0.8666]],"face":[[0.3582,0.1714],[0.6374,0.1654],[0.6418,0.8273],[0.3626,0.8332]]},{"cap":"短歌｜「4月」","aspect":0.707,"tilt":-0.03,"wide":[[0.6555,0.3375],[0.6918,0.33],[0.6888,0.4954],[0.6532,0.4874]],"near":[[0.3561,0.1242],[0.6562,0.1402],[0.6439,0.8711],[0.3438,0.8551]],"face":[[0.374,0.1615],[0.6371,0.1755],[0.626,0.8371],[0.3629,0.8231]]},{"cap":"短歌｜連作「メイデー」","aspect":0.707,"tilt":0,"wide":[[0.5996,0.356],[0.6248,0.3484],[0.624,0.4853],[0.599,0.4821]],"near":[[0.3499,0.132],[0.6501,0.132],[0.6501,0.8633],[0.3499,0.8633]],"face":[[0.3684,0.1684],[0.6316,0.1684],[0.6316,0.8303],[0.3684,0.8303]]},{"cap":"短歌｜連作「誠実盲」","aspect":0.7064,"tilt":0.006,"wide":[[0.5594,0.3683],[0.5779,0.3623],[0.5776,0.4791],[0.5592,0.4772]],"near":[[0.3487,0.1336],[0.6488,0.1304],[0.6513,0.8617],[0.3512,0.8649]],"face":[[0.3674,0.1698],[0.6304,0.167],[0.6326,0.8289],[0.3696,0.8317]]},{"cap":"短歌｜連作「誠実盲」","aspect":0.7064,"tilt":0.075,"wide":[[0.5283,0.3802],[0.5424,0.3706],[0.5437,0.472],[0.5296,0.4756]],"near":[[0.335,0.153],[0.6342,0.1131],[0.665,0.8423],[0.3658,0.8822]],"face":[[0.3549,0.1868],[0.6172,0.1518],[0.6451,0.8118],[0.3828,0.8468]]},{"cap":"短歌｜連作「Alt Me + You」より「この道六年」","aspect":0.7064,"tilt":0,"wide":[[0.5051,0.3845],[0.5163,0.3811],[0.5162,0.4714],[0.505,0.47]],"near":[[0.35,0.132],[0.65,0.132],[0.65,0.8633],[0.35,0.8633]],"face":[[0.3685,0.1684],[0.6315,0.1684],[0.6315,0.8303],[0.3685,0.8303]]},{"cap":"短歌｜連作「ダウンフォース」","aspect":0.7064,"tilt":-0.014,"wide":[[0.4859,0.3899],[0.495,0.3879],[0.4948,0.4691],[0.4857,0.4671]],"near":[[0.3529,0.1283],[0.6529,0.1358],[0.6471,0.867],[0.3471,0.8595]],"face":[[0.3711,0.1651],[0.6341,0.1717],[0.6289,0.8335],[0.3659,0.827]]}],"door":[[0.2991,0.5265],[0.383,0.5234],[0.3821,0.3488],[0.2974,0.3451]]};/*END*/
(function () {
  var L = LOBBY, sc = document.getElementById('sc'), stage = document.getElementById('stage'), hots = document.getElementById('hots'), near = document.getElementById('near'), N = [document.getElementById('n0'), document.getElementById('n1')],
    cap = document.getElementById('cap'), home = document.getElementById('home'), fade = document.getElementById('fade'), num = document.getElementById('num');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, NS = 'http://www.w3.org/2000/svg', AR = L.w / L.h, busy = false, cur = -1, front = 0, deep = false, zimg = document.getElementById('zimg'), zpre = [];
  /* 画を画面いっぱいに（はみ出す側を切る）。縦長の画面では高さに合わせ、横に動かして見る */
  function layout() {
    var vw = innerWidth, vh = innerHeight, w, h;
    if (vw / vh >= AR) { w = vw; h = vw / AR; sc.classList.remove('pan'); } else { h = vh; w = vh * AR; sc.classList.add('pan'); }
    stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.left = (vw / vh >= AR ? 0 : 0) + 'px'; stage.style.top = (vh - h) / 2 + 'px';
    if (sc.classList.contains('pan') && !layout.done) { sc.scrollLeft = (w - vw) * .62; layout.done = true; }
  }
  addEventListener('resize', layout); layout();
  /* 押せる所：ポスター（画の外にあるものは、寄った画の ← → でだけ見る）と劇場の扉 */
  var pts = function (q) { return q.map(function (a) { return (a[0] * L.w).toFixed(1) + ',' + (a[1] * L.h).toFixed(1); }).join(' '); };
  L.posters.forEach(function (p, k) {
    if (!p.wide) return;
    var g = document.createElementNS(NS, 'polygon'); g.setAttribute('points', pts(p.wide)); g.setAttribute('class', 'hot'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', 'ポスターを近くで見る：' + p.cap);
    g.addEventListener('click', function () { open(k); }); g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(k); } });
    g.addEventListener('mouseenter', function () { load(k); if (cur < 0) say(p.cap); }); g.addEventListener('focus', function () { load(k); }); g.addEventListener('mouseleave', function () { if (cur < 0) say(''); });
    hots.appendChild(g);
  });
  var a = document.createElementNS(NS, 'a'); a.setAttribute('href', 'cinema.html'); a.setAttribute('class', 'door'); a.setAttribute('aria-label', '劇場へ（映画館）');
  var dp = document.createElementNS(NS, 'polygon'); dp.setAttribute('points', pts(L.door)); dp.setAttribute('class', 'hot'); a.appendChild(dp); hots.appendChild(a);
  a.addEventListener('mouseenter', function () { if (cur < 0) say('THEATER →'); }); a.addEventListener('mouseleave', function () { if (cur < 0) say(''); });
  a.addEventListener('click', function (e) { if (busy) { e.preventDefault(); return; } e.preventDefault(); enter(); });
  function say(t) { cap.textContent = t; cap.classList.toggle('on', !!t); }
  /* 画の読み込み：広い画が来てから見せる。寄った画は軽くするため先に全部は読まず、ポスターにカーソルが乗ったとき（押したとき）にその一枚だけ読む */
  var wide = document.getElementById('wide'), pre = [];
  function load(k) { if (k < 0 || k >= L.posters.length || pre[k]) return; var im = new Image(); im.src = 'lobby/p' + (k + 1) + '.jpg'; pre[k] = im; }
  function shown() { stage.classList.add('on'); }
  function loadZ(k) { if (k < 0 || zpre[k]) return; var im = new Image(); im.src = 'lobby/z' + (k + 1) + '.jpg'; zpre[k] = im; }
  if (wide.complete) shown(); else wide.addEventListener('load', shown);
  /* 画の上の位置（0–1）を画面の点へ */
  function bbox(q) { var x0 = 1, y0 = 1, x1 = 0, y1 = 0; q.forEach(function (a) { x0 = Math.min(x0, a[0]); y0 = Math.min(y0, a[1]); x1 = Math.max(x1, a[0]); y1 = Math.max(y1, a[1]); }); return [x0, y0, x1, y1]; }
  function nearRect() { var vw = innerWidth, vh = innerHeight, s = Math.max(vw / L.w, vh / L.h); return {x: (vw - L.w * s) / 2, y: (vh - L.h * s) / 2, w: L.w * s, h: L.h * s}; }
  function zoomTo(q, R, scaleOnly) {   /* 広い画の q の枠が、画面の R（中心と高さ）に重なるように拡げる */
    var r = stage.getBoundingClientRect(), b = bbox(q), cx = r.left + (b[0] + b[2]) / 2 * r.width, cy = r.top + (b[1] + b[3]) / 2 * r.height, S = scaleOnly || R.h / ((b[3] - b[1]) * r.height);
    var tx = R.cx - r.left - S * (cx - r.left), ty = R.cy - r.top - S * (cy - r.top);
    stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + S + ')';
  }
  function setNear(k, instant) {
    var im = N[front]; im.src = 'lobby/p' + (k + 1) + '.jpg'; im.alt = 'ポスター（' + L.posters[k].cap + '）の前に立って見た画';
    num.textContent = (k + 1) + ' / ' + L.posters.length; say(L.posters[k].cap); cur = k;
  }
  function ready(k, fn) { load(k); var im = pre[k]; if (!im || im.complete) fn(); else { im.addEventListener('load', fn, {once: true}); im.addEventListener('error', fn, {once: true}); } }
  /* ポスターを押す：画がそのポスターへ寄り、その前に立って見た画に入れ替わる */
  function open(k) {
    if (busy || cur >= 0) return; busy = true; setNear(k); home.textContent = '← ロビー';
    ready(k, function () {
      var nr = nearRect(), b = bbox(L.posters[k].near), R = {cx: nr.x + (b[0] + b[2]) / 2 * nr.w, cy: nr.y + (b[1] + b[3]) / 2 * nr.h, h: (b[3] - b[1]) * nr.h};
      stage.style.transition = reduce ? 'none' : 'transform 1.1s cubic-bezier(.55,0,.25,1)'; zoomTo(L.posters[k].wide, R);
      near.style.transition = reduce ? 'opacity .4s' : 'opacity .45s ease .62s'; near.style.opacity = 1;
      setTimeout(function () { near.classList.add('on'); near.setAttribute('aria-hidden', 'false'); document.body.classList.add('near-mode'); busy = false; load(k - 1); load(k + 1); loadZ(k); }, reduce ? 400 : 1100);
    });
  }
  /* 寄った画で ← → ：となりのポスターへ（重ねて入れ替える） */
  function step(d) {
    if (busy || cur < 0) return; var k = (cur + d + L.posters.length) % L.posters.length; busy = true;
    ready(k, function () { var back = 1 - front, im = N[back]; im.style.transition = ''; im.style.transform = 'none'; im.src = 'lobby/p' + (k + 1) + '.jpg'; im.style.opacity = 1; N[front].style.opacity = 0; front = back; loadZ(k);
      num.textContent = (k + 1) + ' / ' + L.posters.length; say(L.posters[k].cap); cur = k; load(k - 1); load(k + 1); setTimeout(function () { busy = false; }, 500); });
  }
  /* 戻る：寄った画が薄れ、広い画が元の大きさへ。いま見ているポスターが広い画に無いときは、そのまま薄れる */
  function close() {
    if (busy || cur < 0) return; busy = true; var p = L.posters[cur];
    near.classList.remove('on'); near.setAttribute('aria-hidden', 'true'); document.body.classList.remove('near-mode');
    stage.style.transition = 'none';
    if (p.wide) { var nr = nearRect(), b = bbox(p.near); stage.style.transform = 'none'; zoomTo(p.wide, {cx: nr.x + (b[0] + b[2]) / 2 * nr.w, cy: nr.y + (b[1] + b[3]) / 2 * nr.h, h: (b[3] - b[1]) * nr.h}); }
    else stage.style.transform = 'none';
    void stage.offsetWidth;
    near.style.transition = 'opacity .4s'; near.style.opacity = 0;
    stage.style.transition = reduce || !p.wide ? 'none' : 'transform 1s cubic-bezier(.45,0,.3,1) .1s'; stage.style.transform = 'none';
    say(''); home.textContent = '← Top'; cur = -1; setTimeout(function () { busy = false; }, reduce ? 400 : 1100);
  }
  /* 扉を押す：扉へ寄りながら暗くなり、映画館へ */
  function enter() {
    busy = true; var b = bbox(L.door), r = stage.getBoundingClientRect();
    if (!reduce) { stage.style.transition = 'transform 1.2s cubic-bezier(.5,0,.6,1)'; zoomTo(L.door, {cx: r.left + (b[0] + b[2]) / 2 * r.width, cy: r.top + (b[1] + b[3]) / 2 * r.height}, 2.6); }
    fade.style.opacity = 1; setTimeout(function () { location.href = 'cinema.html'; }, reduce ? 700 : 1100);
  }
  addEventListener('pageshow', function (e) { if (e.persisted) { fade.style.transition = 'none'; fade.style.opacity = 0; stage.style.transition = 'none'; stage.style.transform = 'none'; busy = false; void fade.offsetWidth; fade.style.transition = ''; } });
  /* さらに寄る：寄りの画をポスターの面が画面の高さ（または幅）の 92% になるまで拡げ、正面から描いた画を重ねる */
  function face(k) { var nr = nearRect(); return L.posters[k].face.map(function (a) { return [nr.x + a[0] * nr.w, nr.y + a[1] * nr.h]; }); }   /* 左上、右上、右下、左下 */
  function inFace(k, x, y) { var f = face(k), xs = f.map(function (a) { return a[0]; }), ys = f.map(function (a) { return a[1]; }); return x > Math.min.apply(0, xs) && x < Math.max.apply(0, xs) && y > Math.min.apply(0, ys) && y < Math.max.apply(0, ys); }
  function deepIn() {
    if (busy || cur < 0 || deep) return; busy = true; var k = cur, p = L.posters[k]; loadZ(k); var zi = zpre[k];
    function go() {
      var f = face(k), cx = (f[0][0] + f[1][0] + f[2][0] + f[3][0]) / 4, cy = (f[0][1] + f[1][1] + f[2][1] + f[3][1]) / 4, fh = Math.hypot(f[3][0] - f[0][0], f[3][1] - f[0][1]), ang = Math.atan2(f[0][0] - f[3][0], f[3][1] - f[0][1]);
      var vw = innerWidth, vh = innerHeight, th = Math.min(vh * .92, vw * .92 / p.aspect), tw = th * p.aspect, S = th / fh, im = N[front];
      im.style.transition = reduce ? 'none' : 'transform .9s cubic-bezier(.55,0,.25,1), opacity .5s'; im.style.transform = 'translate(' + (vw / 2 - S * cx) + 'px,' + (vh / 2 - S * cy) + 'px) scale(' + S + ')';
      zimg.src = zi.src; zimg.alt = p.cap; zimg.style.width = tw + 'px'; zimg.style.height = th + 'px'; zimg.style.left = (vw - tw) / 2 + 'px'; zimg.style.top = (vh - th) / 2 + 'px'; zimg.style.transform = 'rotate(' + ang + 'rad)';
      zimg.style.transitionDelay = reduce ? '0s' : '.55s'; zimg.style.opacity = 1; zimg.style.pointerEvents = 'auto';
      deep = true; home.textContent = '← 戻る'; near.style.cursor = 'zoom-out'; setTimeout(function () { busy = false; }, reduce ? 400 : 1000);
    }
    if (zi.complete) go(); else { zi.addEventListener('load', go, {once: true}); zi.addEventListener('error', function () { busy = false; }, {once: true}); }
  }
  function deepOut(cb) {
    if (!deep) { if (cb) cb(); return; } busy = true; zimg.style.transitionDelay = '0s'; zimg.style.opacity = 0; zimg.style.pointerEvents = 'none';
    var im = N[front]; im.style.transition = reduce ? 'none' : 'transform .8s cubic-bezier(.45,0,.3,1) .1s, opacity .5s'; im.style.transform = 'none';
    deep = false; home.textContent = '← ロビー'; setTimeout(function () { busy = false; if (cb) cb(); }, reduce ? 300 : 950);
  }
  near.addEventListener('click', function (e) { if (busy) return; if (deep) deepOut(); else if (inFace(cur, e.clientX, e.clientY)) deepIn(); else close(); });
  near.addEventListener('mousemove', function (e) { near.style.cursor = cur >= 0 && !deep && inFace(cur, e.clientX, e.clientY) ? 'zoom-in' : 'zoom-out'; });
  zimg.addEventListener('click', function () { if (!busy) deepOut(); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); }); document.getElementById('next').addEventListener('click', function () { step(1); });
  home.addEventListener('click', function (e) { if (cur >= 0) { e.preventDefault(); if (deep) deepOut(); else close(); } });
  addEventListener('keydown', function (e) { if (cur < 0 || busy) return; var d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
    if (e.key === 'Escape') { if (deep) deepOut(); else close(); } else if (e.key === 'Enter' && !deep) deepIn(); else if (d) { if (deep) deepOut(function () { step(d); }); else step(d); } });
  /* 横長の画面では、縦の回転で広い画を少しだけ動かさない（何もしない）。縦長の画面では横に動かす */
  sc.addEventListener('wheel', function (e) { if (sc.classList.contains('pan') && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { sc.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive: false});
})();
</script>
