<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSS 序　なぜ、愛を書くのか</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Yomogi&display=swap">
<style>

/* 刷り重ね — 紙と層。--mm は紙の上の1ミリ */
.ks-desk{background:var(--desk,#d9dcd8);color:var(--desk-ink,#22262a);font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif)}
.ks-sheet{position:relative;width:100%;max-width:100%;background:var(--paper,#f3f1ea);color:var(--ink,#141414);container-type:inline-size;overflow:hidden;isolation:isolate;
  --mm:calc(100cqw / var(--mm-w, 148));box-shadow:0 1px 0 rgba(0,0,0,.08),0 14px 30px -18px rgba(0,0,0,.45)}

/* 版：墨版(1) → 貼り込み(2) → 朱版・乗算(3) → テープ(4) → 粒子(5) → 逃げ場(6) → 読ませる層(7) */
.ks-sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.ks-sheet canvas.ks-k{z-index:var(--z-plate-ink,1)}
.ks-sheet canvas.ks-r{z-index:var(--z-plate-spot,3);mix-blend-mode:multiply}
.ks-sheet.ks-misreg canvas.ks-r{transform:translate(calc(var(--mm)*var(--rx,0)),calc(var(--mm)*var(--ry,0)));filter:url(#ks-rough)}
.ks-sheet svg.ks-grain{position:absolute;inset:0;width:100%;height:100%;z-index:var(--z-grain,5);mix-blend-mode:multiply;opacity:var(--grain-opacity,.42);pointer-events:none}

/* ③ 貼り込み */
.ks-paste{position:absolute;z-index:var(--z-paste,2);display:block;transform-origin:50% 50%;box-shadow:none;filter:drop-shadow(var(--paste-shadow,0 1.3px 1.9px rgba(0,0,0,.32)))}
.ks-paste.ks-ink{filter:none;mix-blend-mode:multiply}
.ks-paste.ks-full{object-fit:cover}
.ks-tape{position:absolute;z-index:var(--z-tape,4);height:calc(var(--mm)*5.6);background:var(--tape,rgba(221,211,180,.74));transform-origin:50% 50%;box-shadow:0 0 calc(var(--mm)*.3) rgba(0,0,0,.12);pointer-events:none}
.ks-scrap{position:absolute;z-index:var(--z-paste,2);background-size:100% 100%;transform-origin:50% 50%;filter:drop-shadow(var(--paste-shadow,0 1.3px 1.9px rgba(0,0,0,.32)));
  display:flex;align-items:center;justify-content:center;color:var(--ink,#141414);text-align:center}
.ks-tiles{position:absolute;z-index:var(--z-paste,2);transform-origin:50% 50%}
.ks-tile{position:absolute;background:#fbfbf7;filter:drop-shadow(var(--tile-shadow,0 1.1px 1.7px rgba(0,0,0,.3)))}
.ks-tile-pr{position:absolute;inset:calc(var(--mm)*2.2);overflow:hidden}
.ks-tile-pr span{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-weight:900;line-height:1;letter-spacing:-.06em;color:var(--ink,#141414);white-space:nowrap}

/* ① 地の平らな部分＝逃げ場、⑤ 読ませる層 */
.ks-esc{position:absolute;z-index:var(--z-escape,6);background:var(--ink,#141414);color:var(--paper-on-ink,#efece3);transform-origin:50% 50%}
.ks-read{position:absolute;z-index:var(--z-read,7);background:var(--paper,#f3f1ea);color:var(--ink,#141414);padding:calc(var(--mm)*2.6) calc(var(--mm)*3.2);
  font-family:var(--font-mincho,"Shippori Mincho B1",serif);font-size:calc(var(--mm)*2.9);line-height:1.9}
.ks-read p{margin:0}
.ks-read p + p{margin-top:calc(var(--mm)*1.6)}
.ks-read .ks-spot{color:var(--spot-text,#b8371f)}
.ks-read .ks-accent{color:var(--accent,#1f4fb0)}
.ks-read cite{display:block;font-style:normal;font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-size:calc(var(--mm)*2.1);line-height:1.7;color:var(--ink-soft,#4a4a48);letter-spacing:.06em;margin-top:calc(var(--mm)*1.2)}
.ks-read q{display:block;font-family:var(--font-mono,"IBM Plex Mono",monospace);font-style:italic;font-size:calc(var(--mm)*2.3);color:var(--ink-soft,#4a4a48);quotes:none;line-height:1.5}
.ks-read.ks-boxed{border:calc(var(--mm)*.25) solid var(--ink,#141414)}
.ks-h{margin:0;font-family:var(--font-mincho,"Shippori Mincho B1",serif);font-weight:400;font-size:calc(var(--mm)*8);letter-spacing:.1em;line-height:1}
.ks-h small{display:inline-block;margin-left:calc(var(--mm)*4);font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-size:calc(var(--mm)*2.5);letter-spacing:.24em;vertical-align:middle}
.ks-label{font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-weight:700;font-size:calc(var(--mm)*3.3);letter-spacing:.24em}
.ks-code{font-family:var(--font-mono,"IBM Plex Mono",monospace);font-size:calc(var(--mm)*1.8);line-height:1.8;opacity:.82}

/* 行を重ねる一覧（Kamikene『+81』） */
.ks-overlap{margin:0;padding:0;list-style:none;font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-weight:900;font-size:calc(var(--mm)*5.2);line-height:.78;letter-spacing:-.02em}

/* 暗い紙（P02 など mode: dark の手札）：インクは不透明、光を足して重ねる */
.ks-dark.ks-sheet canvas.ks-r{mix-blend-mode:screen}
.ks-dark .ks-paste.ks-ink{mix-blend-mode:screen}
.ks-dark svg.ks-grain{mix-blend-mode:screen;filter:invert(1);opacity:.07}

/* 層を外す */
.ks-off-1 svg.ks-grain,.ks-off-1 .ks-esc{display:none}
.ks-off-3 .ks-paste,.ks-off-3 .ks-tiles,.ks-off-3 .ks-tape,.ks-off-3 .ks-scrap{display:none}
.ks-off-5 .ks-read{visibility:hidden}

@media (prefers-reduced-motion: reduce){.ks-sheet *{transition:none!important}}

/* 手札の一覧（CardDeck） */
.ks-deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif)}
.ks-card{margin:0;display:grid;gap:6px;align-content:start}
.ks-card figcaption{font-size:12px;letter-spacing:.06em;color:var(--desk-ink,#22262a)}
.ks-swatches{display:flex;height:72px;border:1px solid var(--desk-line,#b9beba)}
.ks-swatches span{display:block;min-width:8px}
.ks-thumb{width:100%;height:auto;display:block;background:var(--paper,#f3f1ea)}

/* 生っぽさ（The End of Print から。C11・P04）：写真一枚の地、文字の上に透ける汚れ、一行ずつの白い帯、一句を積む */
.ks-ground{position:absolute;inset:0;width:100%;height:100%;z-index:0;object-fit:cover;display:block}
.ks-stain{position:absolute;z-index:8;pointer-events:none;mix-blend-mode:multiply;display:block}
.ks-dark .ks-stain{mix-blend-mode:screen}
.ks-sheet canvas.ks-over{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
.ks-off-6 .ks-stain,.ks-off-6 canvas.ks-over{display:none}
.ks-off-1 .ks-ground{visibility:hidden}
.ks-read.ks-plain{background:transparent;padding:0;text-shadow:0 0 calc(var(--mm)*.4) var(--paper,#f3f1ea),0 0 calc(var(--mm)*.8) var(--paper,#f3f1ea)}
.ks-read.ks-strip{background:transparent;padding:0;font-family:var(--font-gothic,"Zen Kaku Gothic New",sans-serif);font-weight:700;font-size:calc(var(--mm)*2.2);line-height:2.05;color:var(--ink,#141414)}
.ks-strip .ks-band{background:var(--paper,#f3f1ea);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:calc(var(--mm)*.5) calc(var(--mm)*1.2)}
.ks-read.ks-strip-big{font-family:var(--font-mincho,"Shippori Mincho B1",serif);font-size:calc(var(--mm)*3.6);line-height:1.95}
.ks-read.ks-stack{background:transparent;padding:0;margin:0;white-space:nowrap;line-height:1;color:var(--ink,#141414)}
.ks-stack.ks-inv{color:var(--paper,#f3f1ea)}
.ks-stack .box{background:var(--ink,#141414);color:var(--paper,#f3f1ea);padding:0 .08em}
.ks-stack.ks-inv .box{background:var(--paper,#f3f1ea);color:var(--ink,#141414)}
.ks-stack .ul{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.12em}

/* BSS の号に共通の組み方。紙は雑誌 A4 の片頁（210×297mm、K＝1）、色は手札 P04「投影機の青と赤ペン」 */
:root{
  --font-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --font-hand:"Yomogi","Zen Kaku Gothic New",sans-serif;
  color-scheme:light;
}
html,body{margin:0;padding:0;background:#efe9dd}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.ks-sheet{box-shadow:none}
.ks-sheet img{user-select:none;-webkit-user-drag:none}
.ks-sheet .ks-read{margin:0}
.ks-sheet .ks-read.ks-strip.ks-strip-big{font-size:calc(var(--mm)*4.2);line-height:1.9}

/* 本文：素直な段組み。雑誌なので 3mm、行送り 1.72 */
.body.ks-read{font-family:var(--font-mincho);font-size:calc(var(--mm)*3);line-height:1.72;color:var(--ink);text-align:justify;column-gap:calc(var(--mm)*5.5);column-fill:balance;padding:0;background:transparent;
  text-shadow:0 0 calc(var(--mm)*.4) var(--paper),0 0 calc(var(--mm)*.8) var(--paper)}
.body.ks-read.on-paper{text-shadow:none}
.body p{margin:0;text-indent:1em;orphans:2;widows:2}
.body p + p{margin-top:0}
.body p.q{text-indent:0}
.body .ln{font-family:var(--font-mono);font-weight:400;font-size:calc(var(--mm)*1.6);color:var(--spot-text);letter-spacing:.04em;margin-right:calc(var(--mm)*.8);vertical-align:.3em;text-indent:0}
.body.box{background:var(--paper);padding:calc(var(--mm)*3.2) calc(var(--mm)*3.6);text-shadow:none}

/* 章の題 */
.hd.ks-read{background:transparent;padding:0;margin:0;font-family:var(--font-mincho);font-weight:700;font-size:calc(var(--mm)*7.4);line-height:1.15;letter-spacing:.04em;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 calc(var(--mm)*.6) var(--paper),0 0 calc(var(--mm)*1.2) var(--paper)}
.hd small{display:block;font-family:var(--font-mono);font-weight:400;font-size:calc(var(--mm)*2);letter-spacing:.16em;color:var(--ink-soft);margin-bottom:calc(var(--mm)*1.6)}
.hd.v{writing-mode:vertical-rl}

/* 抜き出しの一文（コピー）。本文から一文をそのまま抜いて大きく。本文にも残す */
.pull.ks-read{background:transparent;padding:0;font-family:var(--font-mincho);font-weight:800;font-size:calc(var(--mm)*6.6);line-height:1.45;letter-spacing:.02em;color:var(--ink);
  text-shadow:0 0 calc(var(--mm)*.6) var(--paper),0 0 calc(var(--mm)*1.2) var(--paper)}
.pull.v{writing-mode:vertical-rl}
.pull.ink{background:var(--ink);color:var(--paper);text-shadow:none;padding:calc(var(--mm)*3) calc(var(--mm)*3.4)}

/* 柱・ノンブル・刷り番号（等幅で小さく、外側の下に） */
.run.ks-read{background:transparent;padding:0;font-family:var(--font-mono);font-size:calc(var(--mm)*1.9);letter-spacing:.12em;line-height:1.3;color:var(--ink);white-space:nowrap}
.run.inv{color:var(--paper)}
.seed.ks-read{cursor:pointer}
.seed.ks-read:focus-visible{outline:calc(var(--mm)*.3) solid var(--accent);outline-offset:calc(var(--mm)*.6)}

/* 図の説明（白い帯） */
.ks-read.ks-strip{font-size:calc(var(--mm)*2.1)}
.ks-strip a{color:inherit}

/* 円く切った写真 */
.ks-paste.round{border-radius:50%}

/* 見開きの層：継ぎ目のテープ（紙片のテープと同じ見た目。刷り直しても動かない） */
.sp-tape{position:absolute;z-index:var(--z-tape,4);height:calc(var(--mm)*5.6);background:var(--tape,rgba(221,211,180,.74));transform-origin:50% 50%;box-shadow:0 0 calc(var(--mm)*.3) rgba(0,0,0,.12);pointer-events:none}

</style>
</head>
<body>

<article class="sheet" id="sheet" aria-label="BSS 序　なぜ、愛を書くのか"></article>
<script>

(function () {
  'use strict';
  var TAU = Math.PI * 2;

  function cssv(name, fb) {
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; } catch (e) { return fb; }
  }

  var ROLES = ['paper', 'ink', 'ink-soft', 'spot', 'spot-text', 'accent', 'paper-on-ink', 'accent-on-ink', 'newsprint', 'tape'];
  function readColors(el) {

    var g = function (n, fb) { var v = cs ? cs.getPropertyValue(n).trim() : ''; return v || fb; };
    C.paper = g('--paper', '#f3f1ea'); C.ink = g('--ink', '#141414'); C.soft = g('--ink-soft', '#4a4a48');
    C.spot = g('--spot', '#d4462c'); C.spotText = g('--spot-text', '#b8371f'); C.accent = g('--accent', '#1f4fb0');
    C.newsprint = g('--newsprint', '#e9e4d6');
    return C;
  }
  readColors();
  var F = {
    mono: '"IBM Plex Mono",ui-monospace,monospace',
    go: '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif',
    min: '"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif',
    brush: '"Yuji Boku","Shippori Mincho B1",serif',
    hand: '"Yomogi","Zen Kaku Gothic New",sans-serif'
  };

  /* 刷り番号から決まる乱数（mulberry32）。同じ番号なら同じ刷り */
  function rng(s) {
    return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  var pad = function (n, l) { return String(n).padStart(l, '0'); };

  function prep(cv, Wmm) {
    var r = cv.getBoundingClientRect(); var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));

  }

    o = o || {}; g.save();
    g.font = (o.it ? 'italic ' : '') + (o.wt || 400) + ' ' + size + 'px ' + (o.f || F.mono);

    if (o.ls) { try { g.letterSpacing = (o.ls * size) + 'px'; } catch (e) {} }
    g.translate(x, y); if (o.rot) g.rotate(o.rot); if (o.mir) g.scale(-1, 1); if (o.a != null) g.globalAlpha = o.a;
    if (o.bg) { var w = g.measureText(s).width, p = size * .25, x0 = o.al === 'center' ? -w / 2 : o.al === 'right' ? -w : 0; g.fillStyle = o.bg; g.fillRect(x0 - p, -size * .92, w + p * 2, size * 1.2); }
    if (o.stroke) { g.strokeStyle = o.c || C.ink; g.lineWidth = o.lw || .2; g.strokeText(s, 0, 0); } else { g.fillStyle = o.c || C.ink; g.fillText(s, 0, 0); }

  function V(g, s, x, y, size, o) {
    o = o || {}; var step = size * (o.lh || 1.1), i = 0;
    Array.from(s).forEach(function (ch) {
      var cx = x, cy = y + i * step + size / 2, rot = 0, ex = o.each ? (o.each(ch, i) || {}) : {};

      T(g, ch, cx + (ex.dx || 0), cy + (ex.dy || 0), size, Object.assign({}, o, { al: 'center', bl: 'middle', rot: rot + (ex.rot || 0) }, ex.o || {}));

  /* ── Halftone：網点。f(x,y) が 0–1 の網％ ── */
  function Halftone(g, x0, y0, w, h, p, deg, f, col) {
    var a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), cx = x0 + w / 2, cy = y0 + h / 2, Rr = Math.hypot(w, h) / 2 + p;
    g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip();
    g.fillStyle = col || C.ink; g.beginPath();
    for (var v = -Rr; v <= Rr; v += p) for (var u = -Rr; u <= Rr; u += p) {

  var Marks = {
    grid: function (g, x0, y0, x1, y1, st, a) { g.save(); g.globalAlpha = a == null ? .15 : a; for (var x = x0; x <= x1 + 1e-6; x += st) line(g, x, y0, x, y1, .08); for (var y = y0; y <= y1 + 1e-6; y += st) line(g, x0, y, x1, y, .08); g.restore(); },
    tombo: function (g, x, y, s, col) { s = s || 5; line(g, x - s / 2, y, x + s / 2, y, .1, col); line(g, x, y - s / 2, x, y + s / 2, .1, col); g.strokeStyle = col || C.ink; g.lineWidth = .1; g.beginPath(); g.arc(x, y, s * .22, 0, TAU); g.stroke(); },
    trims: function (g, W, H, i, l) { i = i || 4; l = l || 5; [[i, i, 1, 1], [W - i, i, -1, 1], [i, H - i, 1, -1], [W - i, H - i, -1, -1]].forEach(function (q) { line(g, q[0] - q[2] * 2, q[1], q[0] + q[2] * l, q[1], .1); line(g, q[0], q[1] - q[3] * 2, q[0], q[1] + q[3] * l, .1); }); },
    /* 見開きの標準：四隅の断ちトンボ＋辺の中点のトンボ */
    standard: function (g, W, H) { Marks.trims(g, W, H); [[W / 2, 5], [W / 2, H - 5], [4, H / 2], [W - 4, H / 2]].forEach(function (p) { Marks.tombo(g, p[0], p[1]); }); },
    dim: function (g, x1, y1, x2, y2, label, col) {

<script>

(function () {

      /* 本文の一行（sources/BSS.md の行番号） */
      par: function (n) { return T[n] || ''; },

      /* 本文を段に流す。from〜to の行（空行は飛ばす）。skip の行は入れない（題に使った行） */
      body: function (o) {

        el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = o.w; if (o.ar) el.dataset.ar = o.ar; if (o.h) el.dataset.h = o.h;

  }

  /* 紙の共通の家具：トンボ、柱、スタンダールの段階の目盛り（いまの段階に赤ペンの丸）、ノンブル */
  function furniture(c, P, C) {
    var k = c.k, r = c.r, R = c.R, inv = P.inv || {};
    if (c.on[2]) K.Marks.trims(k, 210, 297);

    k.save(); k.strokeStyle = col; k.lineWidth = .14; k.globalAlpha = .8; k.beginPath(); k.moveTo(x0 - 2, y - 1.1); k.lineTo(x1 + 2, y - 1.1); k.stroke(); k.restore();

  /* 見開きの層の部品。座標は見開き全体（幅 = 12×210mm）の mm。この紙の分だけずらして置く */
  function spreadHelpers(sheet, h, SX, POS) {
    return {

      add: function (tag, cls, html, o) { o = Object.assign({}, o); o.x -= SX; var el = h.add(tag, cls + ' bleed', html, o); el.setAttribute('aria-hidden', 'true'); return el; },
      stain: function (src, o) { o = Object.assign({}, o); o.x -= SX; var el = K.Stain(sheet, src, o); el.classList.add('sp'); return el; },
      /* 紙と紙の継ぎ目に貼るテープ。刷り直しても動かない（巡ごとの乱数） */
      tape: function (R, x, y, w, rot) {

    /* 柱：左上に号、右上に型番。ノンブルは左下、刷り番号は右下（押すと刷り直す） */
    var inv = P.inv || {};
    h.add('div', 'run' + (inv.head ? ' inv' : ''), 'BSS　僕が先に好きだったのに', {x: 14, y: 7.6});
    var POS = window.BSS_POS || {i: parseInt(P.id, 10) - 1, n: TOTAL, lap: 1, dir: parseInt(P.id, 10), perLap: 12};
    h.add('div', 'run' + (inv.head ? ' inv' : ''), '巡' + POS.lap + '・方位' + POS.dir + '　' + K.Codes.model(parseInt(P.id, 10)).replace('RFC–', 'RFC–BSS–'), {x: 136, y: 7.6, style: 'text-align:right;width:calc(var(--mm)*60)'});
    h.add('div', 'run' + (inv.foot ? ' inv' : ''), K.pad(POS.i + 1, 2) + ' ／ ' + POS.n, {x: 14, y: 286.4});
    /* 見開きの層：一巡（12枚）を一つの見開きとして描く層。この紙は見開きの左から (方位−1)×210mm の所を切り取って見せる */
    var SP = window.BSS_SPREADS && window.BSS_SPREADS[POS.lap], SX = (POS.dir - 1) * 210, sR = K.rng(POS.lap * 104729 + 7);

    sl.setAttribute('role', 'button'); sl.setAttribute('tabindex', '0'); sl.setAttribute('title', '押すと刷り直す（網点・汚れ・紙片の角度・版ずれが変わる）');
    var api = K.Sheet(sheet, {w: 210, h: 297, k: 1, palette: 'P04', seed: seed,

        if (SP && SP.draw) {
          [c.k, c.r].forEach(function (g) { g.save(); g.translate(-SX, 0); });
          SP.draw({k: c.k, r: c.r, R: K.rng(POS.lap * 104729 + 7), C: C, on: c.on, W: POS.perLap * 210, H: 297, X: SX, pos: POS}, sh);

<script>
/* 見開きの層。一巡（12枚）を一つの見開き（12×210＝2520mm × 297mm）として描く。
   座標は見開き全体の mm。紙は自分の分（方位−1）×210mm だけずらして切り取る。2D 全体図で一巡を並べると一枚の絵になる。
   刷り直しても動かない（乱数は巡ごとに決まっている）。
   BSS_SPREADS[巡] = {build(s)：DOM（汚れ・テープ・字）を一度置く, draw(c, s)：版（canvas）に描く} */
(function () {
  var W = 210, POSY = 290;   /* 段階の目盛りの丸の高さ（common.js の furniture と同じ） */
  /* 紙 i の段階の丸の位置（見開き全体の mm）。段階のない紙は null */
  function ringAt(pos, i) { var st = pos.stages[i]; return st == null ? null : {x: (i % pos.perLap) * W + 62 + st * 10, y: POSY}; }
  /* 糸：段階の丸を、紙の継ぎ目をまたいで一本の赤ペンでつなぐ。丸と丸のあいだは下へたわむ */
  function thread(g, R, pts, col) {
    g.save(); g.strokeStyle = col; g.lineWidth = .36; g.lineCap = 'round'; g.globalAlpha = .82; g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], d = Math.abs(b.x - a.x), sag = Math.min(6.5, 1.2 + d / 60);
      var cx = (a.x + b.x) / 2 + (R() - .5) * 8, cy = Math.max(a.y, b.y) + sag + (R() - .5) * 1.2;
      g.quadraticCurveTo(cx, cy, b.x + (R() - .5) * .3, b.y + (R() - .5) * .3);
    }
    g.stroke(); g.restore();
  }
  /* 継ぎ目をまたぐ書き込み（青のボールペン） */
  function note(K, g, R, txt, x, y, size, col, rot) { K.Pen.write(g, txt, x, y, size, col, rot == null ? (R() - .5) * .08 : rot); }
  function arrow(K, g, R, x1, y1, x2, y2, col) {
    K.Pen.line(g, R, x1, y1, x2, y2, .32, col, .85);
    var a = Math.atan2(y2 - y1, x2 - x1), L = 2.6;
    K.Pen.line(g, R, x2, y2, x2 - L * Math.cos(a - .45), y2 - L * Math.sin(a - .45), .32, col, .85);
    K.Pen.line(g, R, x2, y2, x2 - L * Math.cos(a + .45), y2 - L * Math.sin(a + .45), .32, col, .85);
  }
  /* 継ぎ目のテープ：12枚を貼り合わせて一枚の見開きにした跡。上と下の端に */
  function seamTapes(s, R, from, to) {
    for (var k = from; k <= to; k++) {
      var x = k * W;
      s.tape(R, x + (R() - .5) * 4, -2.2 + R() * 1.4, 15 + R() * 6, (R() - .5) * 9);
      s.tape(R, x + (R() - .5) * 4, 292.6 + R() * 1.4, 13 + R() * 6, (R() - .5) * 9);
    }
  }

  window.BSS_SPREADS = {
    /* 巡1：表紙から 7 疑い（二）まで。糸は表紙の端から始まり、段階の丸を順につないで、右の端から巡2へ出ていく */
    1: {
      build: function (s) {
        var R = s.K.rng(1301);
        seamTapes(s, R, 1, 11);
        s.stain('img/smear.png', {x: 4 * W - 46, y: 196, w: 96, rot: -7, opacity: .5});     /* 1 と 2 の継ぎ目 */
        s.stain('img/cola.png', {x: 8 * W - 24, y: 222, w: 46, rot: 18, opacity: .55});     /* 5 の二枚の継ぎ目 */
        s.stain('img/blot.png', {x: 11 * W - 18, y: 24, w: 34, rot: -40, opacity: .5});     /* 7 の二枚の継ぎ目 */
      },
      draw: function (c, s) {
        var K = s.K, g = c.r, R = c.R, C = c.C, PEN = s.PEN, pos = c.pos;
        if (!c.on[4]) return;
        var pts = [{x: 14, y: 293}];
        for (var i = 0; i < pos.perLap && i < pos.n; i++) { var p = ringAt(pos, i); if (p) pts.push(p); }
        pts.push({x: c.W + 4, y: 293});
        thread(g, R, pts, C.accent);
        note(K, g, R, '巡2へ →', c.W - 22, 296, 2.8, C.accent, -.04);
        /* 継ぎ目をまたぐ書き込み */
        note(K, g, R, 'ここから時系列 →', 2 * W - 13, 14.2, 2.9, PEN);
        note(K, g, R, '落ちる', 6 * W - 6, 14, 3.4, PEN, .12); arrow(K, g, R, 6 * W - 2, 15.6, 6 * W + 6, 22, PEN);
        note(K, g, R, '付き合う →', 9 * W - 10, 14.2, 2.9, PEN);
        note(K, g, R, '先取りは失敗する', 10 * W - 14, 14.2, 2.6, C.accent, -.06);
        note(K, g, R, '同じ7が二枚', 11 * W - 10, 280, 2.6, PEN, -.03);
      }
    },
    /* 巡2：8 第二の結晶作用・9 詩とキス・奥付。糸は左の端から入り、奥付の右の端から成長点へ出ていく */
    2: {
      build: function (s) {
        var R = s.K.rng(1302);
        seamTapes(s, R, 1, Math.min(s.pos.n - s.pos.perLap, s.pos.perLap) - 1);
        s.stain('img/blot_k.png', {x: 2 * W - 20, y: 240, w: 40, rot: 30, opacity: .45});
      },
      draw: function (c, s) {
        var K = s.K, g = c.r, R = c.R, C = c.C, PEN = s.PEN, pos = c.pos;
        if (!c.on[4]) return;
        var n2 = pos.n - pos.perLap, pts = [{x: -4, y: 293}];
        for (var i = pos.perLap; i < pos.n; i++) { var p = ringAt(pos, i); if (p) pts.push(p); }
        pts.push({x: n2 * W + 4, y: 293});
        thread(g, R, pts, C.accent);
        note(K, g, R, '← 巡1から', 6, 296, 2.8, C.accent, .03);
        note(K, g, R, '成長点 →', n2 * W - 20, 296, 2.8, C.accent, -.04);
        note(K, g, R, 'もう一度始めよう →', W - 16, 14.2, 2.9, PEN);
        note(K, g, R, '同時に', 2 * W - 8, 14.2, 3.2, C.accent, -.05);
      }
    }
  };
})();

<script>

   貼り込みはマイブリッジのつるはしの男（労働）一点。右下は、この号の台割（15枚の枠）を青のボールペンで描いた作業の紙。12枚目と13枚目のあいだに巡の区切り。
   いまの紙（02）を赤ペンで丸く囲む。抜き出しは「労働しなくなった君たちの愛のために、僕はこの文章を書く。」 */
BSS.page({id: '002', stage: null,
  css: '.q6.ks-read{font-size:calc(var(--mm)*10);letter-spacing:.02em}.p58.ks-read{font-size:calc(var(--mm)*5.8)}' +
       '.esc-b{position:absolute;z-index:var(--z-escape,6);background:var(--ink);color:var(--paper);font-family:var(--font-mincho);font-size:calc(var(--mm)*3);line-height:1.72;padding:calc(var(--mm)*3.4) calc(var(--mm)*3.8);text-align:justify}' +
       '.esc-b p{margin:0;text-indent:1em}' +
       '.ruled.ks-read{border-top:calc(var(--mm)*.5) solid var(--ink);border-bottom:calc(var(--mm)*.2) solid var(--ink);padding:calc(var(--mm)*2.4) 0}',
  font: '序台割表紙なぜ愛を書くのか0123456789恋に恋する感嘆想像希望結晶疑いキス奥付ここ',
  build: function (h) {
    h.body({from: 4, to: 4, x: 14, y: 20, w: 100, h: 56, cols: 1, cls: 'on-paper'});
    h.paste('img/pick.jpg', 'つるはしを振り上げ、振り下ろす男の二十四コマ。コピー機に通したような黒', {x: 124, y: 15, w: 72, ar: 1000 / 1052, rot: 2.2, tape: 2});
    h.strip({x: 118, y: 92, lines: ['Fig.1　つるはしを振る男', 'マイブリッジ『動物の運動』1887年']});
    h.add('h2', 'hd q6', h.esc(h.par(6)), {x: 13, y: 88});
    h.body({from: 7, to: 11, x: 14, y: 107, w: 182, h: 56, cols: 2, cls: 'on-paper'});
    var e = document.createElement('div'); e.className = 'esc-b'; e.innerHTML = '<p>' + h.esc(h.par(13)) + '</p>'; h.mm(e, {x: 14, y: 170, w: 106}); h.sheet.appendChild(e);
    h.add('p', 'pull p58', '労働しなくなった君たちの愛のために、<br>僕はこの文章を書く。', {x: 14, y: 214});
    h.body({from: 15, to: 16, x: 14, y: 246, w: 106, cols: 1, cls: 'on-paper ruled'});
    h.stain('img/blot.png', {x: 168, y: 64, w: 34, rot: 20, opacity: .75});
    h.stain('img/smear.png', {x: 96, y: 262, w: 120, rot: -4, opacity: .7});
  },
  draw: function (c, h, C) {
    var K = h.K, F = h.F, k = c.k, r = c.r, R = c.R, PEN = h.PEN;
    if (c.on[3]) {
      /* 台割：この号の15枚。枠の中に題の頭、いまの紙（02）を赤ペンで囲む */
      var notes = {0: '表紙', 1: '序', 2: '0', 3: '1', 4: '2', 5: '3', 6: '4', 7: '5', 8: '5', 9: '6', 10: '7', 11: '7', 12: '8', 13: '9', 14: '奥付'};
      K.Pen.flatplan(r, R, {x: 130, y: 172, count: 15, cols: 3, bw: 18, bh: 11, gx: 5, gy: 8.6, pen: PEN, red: C.accent, notes: notes, circle: [1]});
      K.Pen.write(r, '台割　BSS', 130, 166, 3.4, PEN, -.04);
      K.Pen.write(r, 'ここ', 161, 196, 2.8, C.accent, -.1);
      K.Pen.line(r, R, 139, 176, 156, 192, .3, C.accent, .8);
      /* 一巡は12枚。13〜15枚目は巡2 */
      K.Pen.line(r, R, 126, 254.2, 200, 253.4, .34, PEN, .85);
      K.Pen.write(r, '巡1 ↑ ／ ↓ 巡2', 166, 251.4, 2.6, PEN, -.02);
    }
    if (c.on[6]) { K.Accident.mirror(k, '序', 176, 158, 26, {c: C.ink, a: .035}); }
  },
  build2: null
});

</script>
